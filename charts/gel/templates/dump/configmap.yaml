{{- if .Values.dump.enabled }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: "{{ .Release.Name }}-dump"
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: dump
    app.kubernetes.io/part-of: {{ .Chart.Name }}
data:
  dump.sh: |
    #!/bin/sh -xe

    DUMP_DIR=/dump/
    gel dump --all --format=dir $DUMP_DIR

    apt update && apt install -y rclone
    rclone sync --s3-provider Other --s3-endpoint $S3_HOSTNAME --s3-region $S3_REGION --s3-access-key-id $S3_ACCESS_KEY --s3-secret-access-key $S3_SECRET_KEY $DUMP_DIR :s3:$S3_BUCKET -P
{{- end }}
