# web server (nginx, main entrygate)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-web"
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/web/configmap.yaml") . | sha256sum }}
        checksum/env: {{ include (print $.Template.BasePath "/secret-smtp.yaml") . | sha256sum }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "dakara.pylibsVolume" . | nindent 8 }}
        - name: nginx-config
          configMap:
            name: {{ .Release.Name }}-nginx-config
      initContainers:
        {{- include "dakara.pylibsInitContainer" . | nindent 8 }}
        # collect static files before running nginx
        - name: collectstatic
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          workingDir: /app/dakara_server
          env:
            {{- include "dakara.env" . | nindent 12 }}
            {{- include "dakara.pylibsEnv" . | nindent 12 }}
          command: ["/app/dakara_server/manage.py", "collectstatic", "--noinput"]
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command: ["/usr/sbin/nginx"]
          volumeMounts:
            - name: nginx-config
              mountPath: /data/config
              readOnly: true
          ports:
            - containerPort: 80
          readinessProbe:
            exec:
              command: ["check_health_web.sh"]
            periodSeconds: 300
            failureThreshold: 1
