# websocket server (daphne)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-websocket"
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: websocket
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: websocket
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/secret-smtp.yaml") . | sha256sum }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: websocket
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          env:
            {{- include "dakara.env" . | nindent 12 }}
          command: ["daphne"]
          args:
            - --log-fmt
            - "[%(asctime)s] [%(process)d] %(levelname)s %(message)s"
            - -b
            - 0.0.0.0
            - -p
            - "80"
            - dakara_server.asgi:application
          ports:
            - containerPort: 80
          readinessProbe:
            exec:
              command: ["check_health_websocket.sh"]
            periodSeconds: 300
            failureThreshold: 1
