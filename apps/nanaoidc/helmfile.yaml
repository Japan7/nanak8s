environments:
  default:
    secrets:
      - ../globals.sops.yaml
      - default.sops.yaml
---
repositories:
  - name: valkey
    url: https://valkey.io/valkey-helm

releases:
  - name: nanaoidc-valkey
    chart: valkey/valkey
    version: 1.0.0
    values:
      - persistence:
          enabled: true
          size: 1Gi
  - name: nanaoidc
    chart: ../../charts/nanaoidc
    values:
      - image:
          tag: main@sha256:d057558e0ff1781c93b3b6d85b05b2ce1beb1e0d49d1d73b747fc3aec319526b
      - config: |
          {{ .Values.config | nindent 10 }}
      - ingress:
          host: auth.{{ .Values.domain }}
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.middlewares: "{{ .Values.traefik.namespace }}-compress@kubernetescrd"
            cert-manager.io/cluster-issuer: letsencrypt
      - forwardAuth:
          ingress:
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.middlewares: "{{ .Values.traefik.namespace }}-compress@kubernetescrd"
              cert-manager.io/cluster-issuer: letsencrypt
            hosts:
              - "longhorn.{{ .Values.domain }}"
              - "nanadb.{{ .Values.domain }}"
              - "nanalook.{{ .Values.domain }}"
              - "traefik.{{ .Values.domain }}"
              - "{{ .Values.domain }}"
